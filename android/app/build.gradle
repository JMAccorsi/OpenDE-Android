apply plugin: 'com.android.application'

android {
    namespace "com.opende.deusex"
    compileSdkVersion 34
    ndkVersion "26.3.11579264"

    defaultConfig {
        applicationId "com.opende.deusex"
        minSdkVersion 26
        targetSdkVersion 34
        versionCode 2
        versionName "0.2-beta"
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DSKIP_UT=ON", "-DSKIP_QA=ON", "-DCMAKE_BUILD_TYPE=Release"
                cppFlags "-O3 -DNDEBUG -ffast-math"
                cFlags "-O3 -DNDEBUG -ffast-math"
                abiFilters 'arm64-v8a'
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    androidResources {
        noCompress 'u', 'int'
    }

    sourceSets.main {
        jniLibs.srcDir 'libs'
    }

    externalNativeBuild {
        cmake {
            path "../../CMakeLists.txt"
            version "3.30.5"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation 'in.dragonbra:javasteam:1.8.0'
    implementation 'in.dragonbra:javasteam-depotdownloader:1.8.0'
    implementation 'org.bouncycastle:bcprov-jdk15to18:1.78.1'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'org.apache.commons:commons-compress:1.26.2'
    implementation 'org.tukaani:xz:1.9'
}
